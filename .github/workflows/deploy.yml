name: Deploy to EC2

on:
  push:
    branches: [dev]
  repository_dispatch:
    types: [backend-updated]

env:
  AWS_REGION: us-east-1
  ECR_REGISTRY: 032155982558.dkr.ecr.us-east-1.amazonaws.com

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout frontend
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push frontend
        env:
          ECR_REGISTRY: ${{ env.ECR_REGISTRY }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t $ECR_REGISTRY/ticketnest-frontend:$IMAGE_TAG .
          docker push $ECR_REGISTRY/ticketnest-frontend:$IMAGE_TAG
          docker tag $ECR_REGISTRY/ticketnest-frontend:$IMAGE_TAG $ECR_REGISTRY/ticketnest-frontend:latest
          docker push $ECR_REGISTRY/ticketnest-frontend:latest

      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: AWS_ACCESS_KEY_ID,AWS_SECRET_ACCESS_KEY
          script: |
            aws configure set aws_access_key_id $AWS_ACCESS_KEY_ID
            aws configure set aws_secret_access_key $AWS_SECRET_ACCESS_KEY
            aws configure set region us-east-1
            aws ecr get-login-password --region us-east-1 | docker login --username AWS --password-stdin 032155982558.dkr.ecr.us-east-1.amazonaws.com
            mkdir -p ~/ticketnest
            cd ~/ticketnest
            echo "" | base64 -d > docker-compose.prod.yml
            echo "" | base64 -d > nginx.conf
            docker compose -f docker-compose.prod.yml down 2>/dev/null || true
            docker compose -f docker-compose.prod.yml pull
            docker compose -f docker-compose.prod.yml up -d

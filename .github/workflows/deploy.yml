name: Deploy to EC2

on:
  push:
    branches: [dev]
  repository_dispatch:
    types: [backend-updated]

env:
  AWS_REGION: us-east-1
  ECR_REGISTRY: 032155982558.dkr.ecr.us-east-1.amazonaws.com
  EC2_HOST: ${{ secrets.EC2_HOST }}

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout frontend
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push frontend
        env:
          ECR_REGISTRY: ${{ env.ECR_REGISTRY }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t $ECR_REGISTRY/ticketnest-frontend:$IMAGE_TAG .
          docker push $ECR_REGISTRY/ticketnest-frontend:$IMAGE_TAG
          docker tag $ECR_REGISTRY/ticketnest-frontend:$IMAGE_TAG $ECR_REGISTRY/ticketnest-frontend:latest
          docker push $ECR_REGISTRY/ticketnest-frontend:latest

      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        script: |
          aws configure set aws_access_key_id $AWS_ACCESS_KEY_ID
          aws configure set aws_secret_access_key $AWS_SECRET_ACCESS_KEY
          aws configure set region us-east-1
          
          aws ecr get-login-password --region us-east-1 | docker login --username AWS --password-stdin 032155982558.dkr.ecr.us-east-1.amazonaws.com
          
          mkdir -p ~/ticketnest
          cd ~/ticketnest
          
          cat > docker-compose.prod.yml << 'EOF'
          services:
            mysql:
              image: mysql:8.1
              container_name: ticketnest-db
              restart: unless-stopped
              environment:
                MYSQL_DATABASE: ticketnest
                MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
                MYSQL_USER: ${DB_USERNAME}
                MYSQL_PASSWORD: ${DB_PASSWORD}
              ports:
                - "3306:3306"
              volumes:
                - mysql_data:/var/lib/mysql
              healthcheck:
                test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}"]
                interval: 10s
                timeout: 5s
                retries: 5
                start_period: 30s
              networks:
                - ticketnest-net

            backend:
              image: 032155982558.dkr.ecr.us-east-1.amazonaws.com/ticketnest-backend:latest
              container_name: ticketnest-backend
              restart: unless-stopped
              environment:
                DB_USERNAME: ${DB_USERNAME}
                DB_PASSWORD: ${DB_PASSWORD}
                JWT_SECRET: ${JWT_SECRET}
              ports:
                - "8080:8080"
              depends_on:
                mysql:
                  condition: service_healthy
              networks:
                - ticketnest-net

            frontend:
              image: 032155982558.dkr.ecr.us-east-1.amazonaws.com/ticketnest-frontend:latest
              container_name: ticketnest-frontend
              restart: unless-stopped
              ports:
                - "80:80"
              volumes:
                - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
              depends_on:
                - backend
              networks:
                - ticketnest-net

          networks:
            ticketnest-net:
              driver: bridge

          volumes:
            mysql_data:
          EOF
          
          cat > nginx.conf << 'EOF'
          server {
              listen 80;
              server_name localhost;

              root /usr/share/nginx/html;
              index index.html;

              location /api/ {
                  proxy_pass http://ticketnest-backend:8080/api/;
                  proxy_set_header Host $host;
                  proxy_set_header X-Real-IP $remote_addr;
                  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                  proxy_set_header X-Forwarded-Proto $scheme;
              }

              location / {
                  try_files $uri $uri/ /index.html;
              }

              location ~* \.(js|css|png|jpg|jpeg|gif|svg|ico|woff|woff2|ttf)$ {
                  expires 1y;
                  add_header Cache-Control "public, immutable";
              }
          }
          EOF
          
          docker compose -f docker-compose.prod.yml down 2>/dev/null || true
          docker compose -f docker-compose.prod.yml pull
          docker compose -f docker-compose.prod.yml up -d

name: Deploy to EC2

on:
  push:
    branches: [dev]
  repository_dispatch:
    types: [backend-updated]

env:
  AWS_REGION: us-east-1
  ECR_REGISTRY: 032155982558.dkr.ecr.us-east-1.amazonaws.com

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout frontend
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push frontend
        run: |
          docker build -t $ECR_REGISTRY/ticketnest-frontend:${{ github.sha }} .
          docker push $ECR_REGISTRY/ticketnest-frontend:${{ github.sha }}
          docker tag $ECR_REGISTRY/ticketnest-frontend:${{ github.sha }} $ECR_REGISTRY/ticketnest-frontend:latest
          docker push $ECR_REGISTRY/ticketnest-frontend:latest

      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: AWS_ACCESS_KEY_ID,AWS_SECRET_ACCESS_KEY,MYSQL_ROOT_PASSWORD,DB_USERNAME,DB_PASSWORD,JWT_SECRET,BASIC_AUTH_PASSWORD
          script: |
            aws configure set aws_access_key_id $AWS_ACCESS_KEY_ID
            aws configure set aws_secret_access_key $AWS_SECRET_ACCESS_KEY
            aws configure set region us-east-1
            aws ecr get-login-password --region us-east-1 | docker login --username AWS --password-stdin $ECR_REGISTRY
            cd ~/ticketnest
            mkdir -p ~/.htpasswd
            htpasswd -nb admin "$BASIC_AUTH_PASSWORD" > ~/.htpasswd/.htpasswd
            printf '%s\n' 'server {' '    listen 80;' '    server_name ticketnest.duckdns.org;' '    return 301 https://$host$request_uri;' '}' 'server {' '    listen 443 ssl;' '    server_name ticketnest.duckdns.org;' '    ssl_certificate /etc/letsencrypt/live/ticketnest.duckdns.org/fullchain.pem;' '    ssl_certificate_key /etc/letsencrypt/live/ticketnest.duckdns.org/privkey.pem;' '    auth_basic "Restricted Access";' '    auth_basic_user_file /etc/nginx/.htpasswd/.htpasswd;' '    root /usr/share/nginx/html;' '    index index.html;' '    location /api/ {' '        proxy_pass http://ticketnest-backend:8080/api/;' '        proxy_set_header Host $host;' '        proxy_set_header X-Real-IP $remote_addr;' '        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;' '        proxy_set_header X-Forwarded-Proto $scheme;' '    }' '    location / {' '        try_files $uri $uri/ /index.html;' '    }' '    location ~* \.(js|css|png|jpg|jpeg|gif|svg|ico|woff|woff2|ttf)$ {' '        expires 1y;' '        add_header Cache-Control "public, immutable";' '    }' '}' > nginx.conf
            printf '%s\n' 'services:' '  mysql:' '    image: mysql:8.1' '    container_name: ticketnest-db' '    restart: unless-stopped' '    env_file: .env' '    environment:' '      MYSQL_DATABASE: ticketnest' '      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}' '      MYSQL_USER: ${DB_USERNAME}' '      MYSQL_PASSWORD: ${DB_PASSWORD}' '    volumes:' '      - mysql_data:/var/lib/mysql' '    networks:' '      - ticketnest-net' '  backend:' '    image: 032155982558.dkr.ecr.us-east-1.amazonaws.com/ticketnest-backend:latest' '    container_name: ticketnest-backend' '    restart: unless-stopped' '    env_file: .env' '    depends_on:' '      - mysql' '    networks:' '      - ticketnest-net' '  frontend:' '    image: 032155982558.dkr.ecr.us-east-1.amazonaws.com/ticketnest-frontend:latest' '    container_name: ticketnest-frontend' '    restart: unless-stopped' '    ports:' '      - "80:80"' '      - "443:443"' '    volumes:' '      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro' '      - /etc/letsencrypt:/etc/letsencrypt:ro' '      - ~/.htpasswd:/etc/nginx/.htpasswd:ro' '    depends_on:' '      - backend' '    networks:' '      - ticketnest-net' 'networks:' '  ticketnest-net:' '    driver: bridge' 'volumes:' '  mysql_data:' > docker-compose.prod.yml
            docker-compose -f docker-compose.prod.yml down --remove-orphans
            docker-compose -f docker-compose.prod.yml up -d
            (crontab -l 2>/dev/null | grep -v "certbot renew"; echo "0 0 * * * certbot renew --quiet --deploy-hook \"docker-compose -f ~/ticketnest/docker-compose.prod.yml restart frontend\"") | crontab -
